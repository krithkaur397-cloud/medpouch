name: iOS

# Every push to main: compile the app on a cloud Mac (no signing, no secrets needed).
# Actions tab -> iOS -> "Run workflow": also archive, sign and upload the build to
# App Store Connect (it then shows up in TestFlight and can be submitted for review).
#
# Repository secrets needed for the upload (Settings -> Secrets and variables -> Actions):
#   APPLE_TEAM_ID   10-character Team ID (developer.apple.com/account -> Membership details)
#   ASC_KEY_ID      Key ID of an App Store Connect API Team key with the Admin role
#   ASC_ISSUER_ID   Issuer ID shown above the key list in App Store Connect
#   ASC_KEY_P8      Full text of the downloaded AuthKey_XXXXXXXXXX.p8 file

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  build:
    name: Compile check
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Check Xcode version
        run: |
          xcodebuild -version
          major=$(xcodebuild -version | awk 'NR==1 { split($2, v, "."); print v[1] }')
          if [ "$major" -lt 26 ]; then echo "::error::Xcode 26 or later is needed (App Store uploads require the iOS 26 SDK)"; exit 1; fi

      - name: Build for the iOS Simulator (unsigned)
        run: |
          xcodebuild build \
            -project MedPouch.xcodeproj -scheme MedPouch -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO -quiet

  release:
    name: Archive and upload to App Store Connect
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: macos-26
    timeout-minutes: 45
    env:
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - name: Install the App Store Connect API key
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          missing=0
          for v in APPLE_TEAM_ID ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8; do
            if [ -z "${!v}" ]; then echo "::error::Repository secret $v is not set"; missing=1; fi
          done
          [ "$missing" = 0 ] || exit 1
          key="$RUNNER_TEMP/AuthKey_$ASC_KEY_ID.p8"
          # Rebuild a clean PEM file whatever the paste looked like: Windows line
          # endings, lost line breaks, extra spaces, or the whole file base64-encoded.
          # Only lengths and yes/no facts are printed, never the key itself.
          KEY_OUT="$key" python3 - <<'PY'
          import base64, binascii, os, re, sys, textwrap
          raw = os.environ["ASC_KEY_P8"]
          print(f"ASC_KEY_P8: {len(raw)} characters, {raw.count(chr(10)) + 1} lines, "
                f"Windows line endings: {'yes' if chr(13) in raw else 'no'}, "
                f"BEGIN line: {'yes' if 'BEGIN PRIVATE KEY' in raw else 'no'}, "
                f"END line: {'yes' if 'END PRIVATE KEY' in raw else 'no'}")
          def body_of(text):
              m = re.search(r"-----BEGIN PRIVATE KEY-----(.*?)-----END PRIVATE KEY-----", text, re.S)
              return re.sub(r"\s+", "", m.group(1) if m else text)
          body = body_of(raw)
          if "BEGIN PRIVATE KEY" not in raw:
              try:
                  decoded = base64.b64decode(body, validate=True).decode("ascii")
                  if "BEGIN PRIVATE KEY" in decoded:
                      print("ASC_KEY_P8 holds the whole .p8 file base64-encoded; decoding it.")
                      body = body_of(decoded)
              except (binascii.Error, UnicodeDecodeError):
                  pass
          try:
              der = base64.b64decode(body, validate=True)
          except binascii.Error:
              sys.exit("::error::ASC_KEY_P8 is not a .p8 private key. Paste the whole text of AuthKey_XXXXXXXXXX.p8, BEGIN and END lines included.")
          print(f"Key body: {len(body)} base64 characters, {len(der)} bytes.")
          with open(os.environ["KEY_OUT"], "w") as f:
              f.write("-----BEGIN PRIVATE KEY-----\n" + "\n".join(textwrap.wrap(body, 64)) + "\n-----END PRIVATE KEY-----\n")
          PY
          chmod 600 "$key"
          if ! openssl pkey -in "$key" -noout 2>/dev/null; then
            echo "::error::ASC_KEY_P8 does not decode to a valid private key. Re-create the secret from the downloaded AuthKey_$ASC_KEY_ID.p8 file (its Key ID must match ASC_KEY_ID)."
            exit 1
          fi
          echo "API key file is a valid private key."
          echo "ASC_KEY_PATH=$key" >> "$GITHUB_ENV"

      # The archive is left unsigned; the export step signs it with an Apple-managed
      # distribution certificate and an App Store profile, so no certificate files or
      # registered devices are needed.
      - name: Archive (Release, build number = run number)
        run: |
          xcodebuild archive \
            -project MedPouch.xcodeproj -scheme MedPouch -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/MedPouch.xcarchive" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            CODE_SIGNING_ALLOWED=NO -quiet

      - name: Sign and upload to App Store Connect
        run: |
          cp ExportOptions.plist "$RUNNER_TEMP/ExportOptions.plist"
          plutil -replace teamID -string "$APPLE_TEAM_ID" "$RUNNER_TEMP/ExportOptions.plist"
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/MedPouch.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"
          echo "Uploaded MedPouch build $BUILD_NUMBER. It appears in App Store Connect -> TestFlight after Apple finishes processing (usually 5 to 30 minutes)." >> "$GITHUB_STEP_SUMMARY"

      - name: Collect distribution logs
        if: failure()
        run: |
          mkdir -p "$RUNNER_TEMP/logs"
          cp -R "${TMPDIR:-/tmp}"/*.xcdistributionlogs "$RUNNER_TEMP/logs/" 2>/dev/null || true

      - name: Upload distribution logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: distribution-logs-${{ github.run_number }}
          path: ${{ runner.temp }}/logs
          if-no-files-found: ignore

      - name: Remove the API key
        if: always()
        run: rm -f "$ASC_KEY_PATH"
